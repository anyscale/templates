name: ray-version-prep

# Prepare a new Ray version so a fanout can fire.
#
# scripts/ray-bump/prepare-ray-version.py resolves the newest stable Ray and, once
# Anyscale published its images but we don't yet hold their freezes, adds the version's
# build_arg_sets (copying the current matrix forward); this workflow then fetches the
# freezes and opens a PR. A human reviews + merges it (the approval gate), then pushes a
# `ray-fanout-<v>` tag to fire ray-bump-fanout.yaml.
#
# Minor-only: on the daily schedule it acts only on a new Ray *minor* (patches over the
# current minor, e.g. 2.56.0 → 2.56.1, are skipped). To force a specific version anyway
# (incl. a patch), dispatch this workflow with the `ray_version` input set (→ --version).
#
# If an image we track has no tag for the new version the matrix moved: the script stops
# with 'needs human' (rc=2) and a maintainer runs
# .claude/skills/template/workflows/upgrade-dependencies.md.

on:
  schedule:
    - cron: "17 8 * * *"   # daily; Ray minors are ~monthly, so a daily poll suffices
  workflow_dispatch:
    inputs:
      ray_version:
        description: "Target Ray version (blank = newest stable on PyPI)"
        required: false
        default: ""
      dry_run:
        description: "Plan only — print the depsets.yaml diff, don't recompile or open a PR"
        type: boolean
        default: true

concurrency:
  group: ray-version-prep
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
    # A PAT (if exposed as ANYSCALE_GH_TOKEN) makes the opened PR trigger premerge
    # CI; otherwise it falls back to github.token and a maintainer nudges CI.
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.ANYSCALE_GH_TOKEN || github.token }}
    - uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Install deps
      run: uv sync --frozen --only-group ray-bump

    - name: Prepare the version
      id: prep
      env:
        INPUT_VERSION: ${{ inputs.ray_version }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set +e
        args=()
        [ -n "$INPUT_VERSION" ] && args+=(--version "$INPUT_VERSION")
        # dispatch previews unless dry_run=false; the daily schedule always executes
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" != "false" ]; then
          args+=(--dry-run)
        fi
        uv run python3 scripts/ray-bump/prepare-ray-version.py "${args[@]}"
        echo "rc=$?" >> "$GITHUB_OUTPUT"

    - name: Needs human
      if: steps.prep.outputs.rc == '2'
      run: |
        echo "::error::prepare-ray-version needs a human (the image matrix moved). Run workflows/upgrade-dependencies.md for this version."
        exit 1

    - name: Unexpected error
      if: steps.prep.outputs.rc != '0' && steps.prep.outputs.rc != '2' && steps.prep.outputs.rc != '10'
      run: |
        echo "::error::prepare-ray-version exited ${{ steps.prep.outputs.rc }} (unexpected — likely a transient upstream/network error; the next scheduled run retries)."
        exit 1

    # Templates seed their locks from these — they are the whole payload of this PR.
    - name: Refresh image freezes
      if: steps.prep.outputs.rc == '10'
      env:
        V: ${{ steps.prep.outputs.version }}
      run: python3 scripts/depsets/refresh-image-freezes.py "$V"

    # Same gate the fanout uses, so the PR states up front whether pushing
    # ray-fanout-<v> would actually be accepted.
    - name: Check the version is complete
      id: complete
      if: steps.prep.outputs.rc == '10'
      env:
        V: ${{ steps.prep.outputs.version }}
      run: |
        if err="$(uv run python3 scripts/ray-bump/latest-depset-version.py --require "$V" 2>&1 >/dev/null)"; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "detail=$err" >> "$GITHUB_OUTPUT"
          echo "::warning::$err"
        fi

    - name: Open the version-prep PR
      if: steps.prep.outputs.rc == '10'
      env:
        GH_TOKEN: ${{ secrets.ANYSCALE_GH_TOKEN || github.token }}
        V: ${{ steps.prep.outputs.version }}
        READY: ${{ steps.complete.outputs.ready }}
        DETAIL: ${{ steps.complete.outputs.detail }}
      run: |
        branch="ray-prep/$V"
        # Separate "the query failed" from "no PR is open" — conflating them would
        # delete the branch of a PR that is open, closing it and losing its review.
        if ! open_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')"; then
          echo "::error::gh pr list failed for $branch; not touching it."
          exit 1
        fi
        if [ -n "$open_pr" ]; then
          echo "A version-prep PR is already open for $branch (#$open_pr) — nothing to do."
          exit 0
        fi
        # No open PR, but the branch can survive a closed one — a plain push would
        # then be rejected as non-fast-forward and the run would fail every day.
        git push origin --delete "$branch" 2>/dev/null \
          && echo "Removed the abandoned $branch (its PR was closed)." || true
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -c "$branch"
        git add dependencies/
        git commit -s \
          -m "chore(deps): image freezes for Ray $V" \
          -m "Added the $V build_arg_sets and fetched a freeze of each tracked image so ray-bump-fanout can fire for $V."
        git push -u origin "$branch"

        if [ "$READY" = "true" ]; then
          status="Every tracked image has a freeze — pushing \`ray-fanout-$V\` will be accepted."
        else
          status="⚠️ **Not ready to fan out.** $DETAIL
        Merging is still fine (the freezes present are correct); the fanout stays blocked until the missing images publish and the next scheduled run commits their freezes."
        fi

        gh pr create --base main --head "$branch" \
          --title "[ray-prep] Ray $V" \
          --body "Automated prep for Ray \`$V\` (the \`ray-version-prep\` workflow), so \`ray-bump-fanout\` can fire for it. Adds the \`$V\` \`build_arg_sets\` and a freeze of each tracked image (matrix copied forward from the previous version; templates are untouched — each moves in its own fanout PR).

        $status

        **Review + merge = the approval gate.** Then push \`ray-fanout-$V\` to start the fanout."
        gh pr edit "$branch" --add-label ray-update || true
