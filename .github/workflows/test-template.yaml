name: test-template

on:
  issue_comment:
    types: [created]

# issue_comment runs with repository secrets, so this workflow never executes
# code from the PR. Scripts come from the default branch; the PR checkout is
# read as data only (BUILD.yaml, so templates added in the PR validate).
permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-template-test:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/test-template ') &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
    - name: Get PR ref
      id: pr
      uses: actions/github-script@v7
      with:
        script: |
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });
          if (pr.data.head.repo.full_name !== pr.data.base.repo.full_name) {
            core.setFailed('Cannot test templates from fork PRs');
            return;
          }
          core.setOutput('branch', pr.data.head.ref);
          core.setOutput('sha', pr.data.head.sha);

    - name: Checkout default branch (trusted scripts)
      uses: actions/checkout@v4
      with:
        path: trusted
        persist-credentials: false

    - name: Checkout PR BUILD.yaml (data only, never executed)
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.pr.outputs.sha }}
        path: pr
        persist-credentials: false
        sparse-checkout: BUILD.yaml
        sparse-checkout-cone-mode: false

    - name: Parse and validate template names
      id: parse
      working-directory: pr
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: bash "$GITHUB_WORKSPACE/trusted/scripts/test-pipeline/parse-test-template-comment.sh"

    - name: Trigger Buildkite build
      env:
        BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        BUILDKITE_ORG: ${{ secrets.BUILDKITE_ORG }}
        BUILDKITE_PIPELINE: ${{ secrets.BUILDKITE_TEMPLATE_TEST_PIPELINE }}
        ANYSCALE_CLI_TOKEN_SECRET_NAME: ${{ secrets.ANYSCALE_CLI_TOKEN_SECRET_NAME }}
        # Pass PR-derived values through env, not ${{ }} in the script body,
        # so a crafted branch name can't inject shell.
        PR_BRANCH: ${{ steps.pr.outputs.branch }}
        PR_SHA: ${{ steps.pr.outputs.sha }}
        PR_NUMBER: ${{ github.event.issue.number }}
        TEMPLATES: ${{ steps.parse.outputs.templates }}
      run: |
        curl -sfS -o /dev/null \
          -X POST \
          -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$(jq -n \
            --arg branch "$PR_BRANCH" \
            --arg sha "$PR_SHA" \
            --arg templates "$TEMPLATES" \
            --arg msg "Test templates: $TEMPLATES (PR #$PR_NUMBER)" \
            --arg secret "$ANYSCALE_CLI_TOKEN_SECRET_NAME" \
            '{
              message: $msg,
              commit: $sha,
              branch: $branch,
              env: {
                TEMPLATE_NAMES: $templates,
                ANYSCALE_CLI_TOKEN_SECRET_NAME: $secret
              }
            }'
          )" \
          "https://api.buildkite.com/v2/organizations/${BUILDKITE_ORG}/pipelines/${BUILDKITE_PIPELINE}/builds"
