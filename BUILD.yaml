# owner_team ray-data: Parquet read path, no Train/Serve/LLM surface.
#
# The lifted finding was "the read binds, and the blob column's Parquet physical type is worth
# 7x-23x". Measured on this repo's own configs/ (one g6.4xlarge L4, m5.2xlarge head) on Ray
# 2.57.0, it did not reproduce. What the template claims now:
#
#   - the layout costs decode CPU, not I/O. list<uint8> is physical INT32, so a payload byte
#     occupies 4 bytes; RLE_DICTIONARY removes that before any codec runs, so the layouts land
#     1.00x apart on disk with dictionary on (0.50x, list smaller, on the quantized payload,
#     whose bytes take 16 values) and 4.00x apart with it off. The flag is use_dictionary on the
#     list column. Footer total_uncompressed_size, 6 codecs x 3 payloads x dictionary on/off,
#     pyarrow 23.0.1 as the image ships. Compression is not the mechanism: the effect is complete
#     with codec `none` and survives os.urandom.
#   - decode is 10.94x from byte-identical inputs, 4.51x under zstd, on a macOS arm64 laptop,
#     warm cache.
#   - end to end with the GPU stage, 1.56x to 1.65x on 5 fleet runs. On Ray 2.58.0, 1.69x to
#     1.78x on 3 rayapp test runs, 2 prod and 1 staging, above the 2.57.0 range on all 3.
#   - the write side is 4.07x to 4.19x on 8 fleet runs, spread 2.9%. On Ray 2.58.0, 4.01x to
#     4.18x on the same 3 runs.
#   - the read was not the binding stage here: read span 2.44s, GPU stage span 1.99s with 3.4s
#     UDF across 2 actors. On Ray 2.58.0, read span 2.39s to 2.6s with UDF time 0us, GPU stage
#     span 1.9s to 2.06s with 3.33s to 3.63s UDF. num_cpus 1.0 against 0.25 gave overlapping
#     ranges. Decoder threads 1 to 4 gave 1.2% or better.
#   - storage does not turn it into an I/O lever, measured on the worker across
#     /mnt/local_storage and /mnt/cluster_storage, cold and warm, codec none. Slow storage
#     SHRINKS the advantage: 32x warm on local disk down to 3.2x cold on the shared mount,
#     because the mount caps the fast layout while list<uint8> is already CPU-bound at
#     65-128 MB/s of logical payload in every arm. Dictionary off adds a real but small I/O
#     component, 3.2x to 4.6x cold on the shared mount. Mount cold throughput: local
#     1906.6 MB/s, cluster_storage 138.2 MB/s.
#
# measure_layout.py is a shipped artifact, not scaffolding. Every engagement figure is retained
# and labelled as theirs, on a different fleet and dataset. Unmeasured: whether the read binds at
# production scale. Evidence: prodjob_mnm3w6i1azkcfq22q8radiaxt5 (sweeps),
# prodjob_ahrqy85kid81ttws4eq6wi7uge (tests.sh), prodjob_l6gmktnb38knsk1s7ag8djjg3i and
# prodjob_plvai31pc9sh7fvyia2sddsqdz (storage). Ray 2.58.0, rayapp test on 2026-09-24:
# expwrk_myl4k381ppkr7m3qqwneji6dn5 and expwrk_vj5mavktt6myffgvc3xcsgkryz (prod),
# expwrk_ftbzk4kw754vmqmrrw42hrz4lr (staging).
# owner: @em-anyscale
- name: ray-data-sensor-frame-extraction
  owner_team: ray-data
  dir: templates/ray-data-sensor-frame-extraction
  cluster_env:
    image_uri: anyscale/ray:2.58.0-py312-cu129
  compute_config:
    AWS: configs/ray-data-sensor-frame-extraction/aws.yaml
    GCP: configs/ray-data-sensor-frame-extraction/gce.yaml
  test:
    tests_path: tests/ray-data-sensor-frame-extraction/
    command: bash tests.sh
    # Measured on Ray 2.57.0: tests.sh wall time 335s to 354s across 6 runs, papermill over the
    # notebook as CI runs it, exit 0, 6 code cells, Executing/Ending counts matched. 1200 leaves
    # 3.4x headroom over the slowest.
    # Cluster start and image pull sit outside this. Headroom covers a 1.2 GiB torch download to
    # the driver and Ray building the lock's virtualenv on the worker, 85.1s to 94.0s over 3 runs
    # on Ray 2.57.0, 89.1s to 96.8s over 3 on Ray 2.58.0.
    # A transient PyPI 502 failed one run of this script.
    # Ray 2.58.0, rayapp test start to finish with workspace start and teardown included: 8m58s
    # to 9m26s over 3 runs, 2 prod and 1 staging, exit 0.
    timeout_in_sec: 1200
