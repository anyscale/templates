head_node:
  instance_type: m5.2xlarge
  resources:
    CPU: 0
worker_nodes:
# Sized with the notebook's runtime_attr_flye and flye_num_threads (30): change them together.
# One worker per concurrent assembly. On spot, a lost node spends the task's preemptible_tries.
- name: assembly-worker
  instance_type: m5.8xlarge
  min_nodes: 1
  max_nodes: 3
  market_type: PREFER_SPOT
