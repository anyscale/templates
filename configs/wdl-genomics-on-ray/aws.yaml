head_node:
  instance_type: m5.2xlarge
  resources:
    CPU: 0
worker_nodes:
# 32 vCPU / 128 GiB. Read together with the notebook's runtime_attr_flye, which asks for 30
# cpu_cores: on Ray a resource request that no node can satisfy is an indefinite wait, not an
# error, so the instance type and the workflow's request are one decision, not two.
# min_nodes: 1 so the first WDL task does not wait on a cold autoscale.
#
# max_nodes: 3 because the notebook assembles a three-sample cohort. Each sample's Flye task
# holds 30 of a node's 32 vCPUs, so three concurrent assemblies want three nodes, and getting
# them is the demonstration. Measured at `quick` scale on this shape: the three assemblies
# queued 32s, 93s and 93s, landed on three separate workers, and the cohort took 8m05s against
# 7m52s for its slowest single sample. The smaller tasks pack into the 2 vCPUs left over rather
# than booting anything.
#
# Lower this and the cohort still completes, just less concurrently; nothing hangs, because the
# *per-task* requests still fit one node. Measured at max_nodes 2, the third assembly queues
# 7m37s behind the first and the same run takes 13m16s.
#
# market_type: PREFER_SPOT. Every task carries preemptible_tries: 3 (the inputs JSONs and the
# notebook's inputs), and a reclaimed node surfaces as node or worker loss, which the backend maps
# to miniwdl's Interrupted and so to that budget; a lost task reruns from its start, a lost Flye
# from `configure`. The schema allows market_type on worker groups only, so the head stays on
# demand. Estimated, not measured: the Spot Advisor's -69% for m5.8xlarge (us-west-2, 2026-09-24)
# would take the measured trio from about $10 to about $3.65. No real reclaim has hit this yet.
- name: assembly-worker
  instance_type: m5.8xlarge
  min_nodes: 1
  max_nodes: 3
  market_type: PREFER_SPOT
