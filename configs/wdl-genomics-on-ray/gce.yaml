head_node:
  instance_type: n2-standard-8
  resources:
    CPU: 0
worker_nodes:
# 32 vCPU / 128 GiB, matching the AWS config's m5.8xlarge, and sized with the notebook's
# runtime_attr_flye (30 cpu_cores, and flye_num_threads 30): change the instance type and
# those together. min_nodes: 1 so the first WDL task does not wait on a cold autoscale.
#
# max_nodes: 3, one worker per concurrent assembly, since each sample's Flye task holds 30 of a
# node's 32 vCPUs. The queue and wall-clock timings in aws.yaml were measured on AWS.
#
# market_type: PREFER_SPOT, for the reasons in aws.yaml. The schema allows market_type on worker
# groups only, so the head stays on demand. GCE spot pricing for n2-standard-32 is unverified
# here, and no real reclaim has hit this yet.
# Multi-zone, as configs/text-embeddings/gce.yaml does, so a spot shortage in one zone is not a stall.
- name: assembly-worker
  instance_type: n2-standard-32
  min_nodes: 1
  max_nodes: 3
  market_type: PREFER_SPOT
advanced_instance_config:
  instance_properties:
    labels:
      as-feature-multi-zone: 'true'
