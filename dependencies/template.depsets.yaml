  - name: serve_stable_diffusion_depset_${RAY_VERSION}_${PYTHON_VERSION}
    operation: compile
    requirements:
      - templates/serve-stable-diffusion-v2/requirements.txt
    output: templates/serve-stable-diffusion-v2/python_depset.lock
    include_setuptools: true
    append_flags:
