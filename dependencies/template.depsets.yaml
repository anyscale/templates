# ray-llm templates seed their lock from a freeze of the image
# (dependencies/scripts/seed-image-freeze.sh): the image is built with --no-deps,
# so no resolvable lock describes it.

build_arg_sets:
  ray2551_py311_cu128:
    RAY_VERSION: "2.55.1"
    PYTHON_VERSION: "3.11"
    PYTHON_SHORT: "311"
    CUDA_VARIANT: "cu128"
  ray2551_py312_cu128:
    RAY_VERSION: "2.55.1"
    PYTHON_VERSION: "3.12"
    PYTHON_SHORT: "312"
    CUDA_VARIANT: "cu128"
  ray2560_py311_cu128:
    RAY_VERSION: "2.56.0"
    PYTHON_VERSION: "3.11"
    PYTHON_SHORT: "311"
    CUDA_VARIANT: "cu128"
  ray2560_py312_cu128:
    RAY_VERSION: "2.56.0"
    PYTHON_VERSION: "3.12"
    PYTHON_SHORT: "312"
    CUDA_VARIANT: "cu128"
  ray2560_py312_cu130:
    RAY_VERSION: "2.56.0"
    PYTHON_VERSION: "3.12"
    PYTHON_SHORT: "312"
    CUDA_VARIANT: "cu130"

depsets:
  - name: ray_depset_${RAY_VERSION}_${PYTHON_VERSION}
    operation: compile
    requirements:
      - /tmp/ray-deps/ray_img_${RAY_VERSION}_py${PYTHON_SHORT}.lock
    output: dependencies/depsets/ray_${RAY_VERSION}_img_py${PYTHON_SHORT}.lock
    append_flags:
      - --python-version=${PYTHON_VERSION}
      - --python-platform=linux
      - --unsafe-package ray
    build_arg_sets:
      - ray2551_py311_cu128
      - ray2551_py312_cu128
      - ray2560_py311_cu128
      - ray2560_py312_cu128

    pre_hooks:
      - dependencies/scripts/fetch-ray-depsets.sh ${RAY_VERSION} ${PYTHON_SHORT}
      - dependencies/scripts/fetch-ray-constraints.sh ${RAY_VERSION} ${PYTHON_VERSION}

  - name: serve_stable_diffusion_depset_${RAY_VERSION}_${PYTHON_VERSION}_${CUDA_VARIANT}
    operation: expand
    depsets:
      - ray_depset_${RAY_VERSION}_${PYTHON_VERSION}
    requirements:
      - templates/serve-stable-diffusion-v2/requirements.txt
    output: templates/serve-stable-diffusion-v2/python_depset.lock
    append_flags:
      - --python-version=${PYTHON_VERSION}
      - --python-platform=linux
      - --unsafe-package ray
    build_arg_sets:
      - ray2560_py312_cu128

  - name: langchain_agent_ray_serve_depset_${RAY_VERSION}_${PYTHON_VERSION}
    operation: compile
    requirements:
      - templates/langchain-agent-ray-serve/requirements.txt
    output: templates/langchain-agent-ray-serve/python_depset.lock
