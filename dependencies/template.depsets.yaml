      - --python-version=${PYTHON_VERSION}
      - --python-platform=x86_64-manylinux_2_31
      - --unsafe-package ray
    build_arg_sets:
      - ray2560_py312_cu130
    pre_hooks:
      - dependencies/scripts/seed-image-freeze.sh dependencies/images/ray-llm-${RAY_VERSION}-py${PYTHON_SHORT}-${CUDA_VARIANT}.freeze.txt templates/langchain-agent-ray-serve/python_depset.lock

