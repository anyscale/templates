# Every template seeds its lock from a freeze of the image it runs on
# (scripts/depsets/seed-image-freeze.sh) rather than resolving against a base
# lock: a lock models the build recipe, a freeze measures the shipped image.
#
# Every entry sets `include_setuptools: true`. uv drops setuptools from a lock by
# default, but Ray builds each runtime env as a virtualenv whose own seeded copy
# shadows the image's -- so a locked package requiring a newer setuptools makes pip
# collect it unpinned, and a lock full of hashes puts pip in hash-checking mode,
# where an unhashed collect fails every runtime env for that template. Pinning it
# from the seed (the image's own version) removes the question.
# scripts/hooks/check-dep-delivery.py `depset-config` keeps this true for new entries.

build_arg_sets:
  ray2560_py311:
    RAY_VERSION: "2.56.0"
    PYTHON_VERSION: "3.11"
    PYTHON_SHORT: "311"
  ray2560_py312:
    RAY_VERSION: "2.56.0"
    PYTHON_VERSION: "3.12"
    PYTHON_SHORT: "312"
  ray2560_py312_cu130:
    RAY_VERSION: "2.56.0"
    PYTHON_VERSION: "3.12"
    PYTHON_SHORT: "312"
    CUDA_VARIANT: "cu130"

  ray2570_py311:
    RAY_VERSION: "2.57.0"
    PYTHON_VERSION: "3.11"
    PYTHON_SHORT: "311"
  ray2570_py312:
    RAY_VERSION: "2.57.0"
    PYTHON_VERSION: "3.12"
    PYTHON_SHORT: "312"
