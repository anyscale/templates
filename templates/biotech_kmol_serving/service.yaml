name: biotech-kmol-ensemble-serving

applications:
  - name: default
    import_path: serve_app:app
    route_prefix: /
    deployments:
      - name: KmolEnsemble
        # min_replicas=1 keeps a warm replica so autotune/checkpoint-load is never
        # on the request path (REC 6). Batching lets each replica hold many requests,
        # so target/ceiling run high.
        num_replicas: auto
        autoscaling_config:
          min_replicas: 1
          max_replicas: 8
          target_ongoing_requests: 32
          upscale_delay_s: 15
          downscale_delay_s: 120
        max_ongoing_requests: 128
        ray_actor_options:
          num_cpus: 4
          # REC 7: fractional GPU packs multiple replicas per card. 0.25 -> 4/L4.
          num_gpus: 0.25

# IMPORTANT: kMoL is a CUDA 11.7 / Python 3.9 / PyTorch 1.13.1 conda stack and does
# NOT run on a stock Ray py311/cu12 image. Build the custom image (see Dockerfile),
# push it, and put its URI here.
image_uri: <YOUR_REGISTRY>/kmol-ray-serve:latest

working_dir: .

env_vars:
  KMOL_CONFIG_PATH: "configs/ensemble_serve.example.json"
  # REC 5: keep PyTorch from oversubscribing cores across replicas.
  OMP_NUM_THREADS: "4"
  # Deployment tunables (also settable per-replica). Batching knobs:
  KMOL_MAX_BATCH_SIZE: "64"
  KMOL_BATCH_WAIT_S: "0.02"
  KMOL_NUM_GPUS: "0.25"
  KMOL_MIN_REPLICAS: "1"
  KMOL_MAX_REPLICAS: "8"

compute_config:
  head_node:
    instance_type: m5.2xlarge      # CPU head; no GPU work here
  worker_nodes:
    - instance_type: g6.xlarge     # 1x L4 GPU; 4 replicas via num_gpus=0.25
      min_nodes: 1
      max_nodes: 4

query_auth_token_enabled: true
