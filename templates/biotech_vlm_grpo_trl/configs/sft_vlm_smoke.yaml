# TRL SFT smoke test, VLM mode: Qwen3-VL-2B on fake slide tiles + QA (make_sft_data.py).
# Keys: ScriptArguments (train_sft_trl.py), trl.SFTConfig, trl.ModelConfig. CLI overrides any key.
env:
  TOKENIZERS_PARALLELISM: "false"

# --- ScriptArguments ---
data_dir: /mnt/cluster_storage/data/pathai_sft_fake
mode: vlm
sample_after_train: true

# --- ModelConfig ---
model_name_or_path: Qwen/Qwen3-VL-2B-Instruct
model_revision: 89644892e4d85e24eaac8bacfd4f463576704203
dtype: bfloat16
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
lora_task_type: CAUSAL_LM

# --- SFTConfig ---
output_dir: /mnt/cluster_storage/trl_sft/sft_vlm_fake/out
run_name: sft_vlm_fake
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
max_steps: 20
max_length: 1024
packing: false                   # the vision collator does not pack; keep both modes identical
bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
logging_steps: 1
eval_strategy: steps
eval_steps: 10
report_to: [tensorboard]
save_strategy: steps            # HF checkpoint-N under output_dir; Ray Train copies it to ray_results
save_steps: 10
save_total_limit: 2
seed: 42
dataloader_num_workers: 0
