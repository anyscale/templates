name: sd-lora-finetuning
entrypoint: python scripts/run_training.py --num-workers 2 --num-epochs 3
image_uri: anyscale/ray:2.56.0-py311-cu128
compute_config:
  head_node:
    instance_type: m5.2xlarge
  worker_nodes:
    - name: gpu-workers
      instance_type: g4dn.xlarge
      min_nodes: 2
      max_nodes: 2
env_vars:
  HF_HOME: /mnt/cluster_storage/hf_cache
# Pin to the lock so the driver and workers share one env; the hand-maintained >= list
# drifted from requirements.txt (unpinned datasets resolves to 2.14.4, numpy floats to 2.x).
requirements: python_depset.lock
max_retries: 2
