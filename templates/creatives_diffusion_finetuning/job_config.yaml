name: sd-lora-finetuning
# The lock is installed here rather than via `requirements:`: that key makes the CLI
# inline the file into the submitted runtime_env, and this lock (175 KB, nearly all
# hashes) is past its 120 KB cap. This covers the driver; run_training.py's
# ray.init(runtime_env=) covers the Train workers.
entrypoint: >-
  uv pip install -r python_depset.lock --system --no-deps --no-cache-dir --index-strategy unsafe-best-match
  && python scripts/run_training.py --num-workers 2 --num-epochs 3
image_uri: anyscale/ray:2.57.0-py311-cu128
compute_config:
  head_node:
    instance_type: m5.2xlarge
  worker_nodes:
    - name: gpu-workers
      instance_type: g4dn.xlarge
      min_nodes: 2
      max_nodes: 2
env_vars:
  HF_HOME: /mnt/cluster_storage/hf_cache
max_retries: 2
