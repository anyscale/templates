# workspace_prod.yaml
# Internal-only helper to launch a workspace on the EKS/Kueue H100 cluster.
# Keep out of git. Create with:
#     anyscale workspace_v2 create -f workspace_prod.yaml
name: ws-nemotron-3-super
image_uri: anyscale/ray-llm:2.57.0-py312-cu130
cloud: rkn-gpu-cloud  # primary resource is us-east-1
compute_config:
  advanced_instance_config:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: llm-team-queue
  head_node:
    required_resources:
      CPU: 4
      memory: 16Gi
  worker_nodes:
    # H100 worker autoscales up only when `serve run` requests 4 GPUs (TP=4).
    - required_resources:
        CPU: 92
        memory: 960Gi
        GPU: 4
      required_labels:
        ray.io/accelerator-type: H100
      min_nodes: 0  # no idle H100 cost until serve run needs it
      max_nodes: 1  # one 4-GPU replica
