name: ecommerce-recommendation-serving
image_uri: anyscale/ray:2.56.0-py311-cu128
compute_config:
  head_node:
    instance_type: m5.2xlarge
  worker_nodes:
    - name: gpu-workers
      instance_type: g4dn.xlarge   # T4 GPU — one per ProductRanker replica
      min_nodes: 1
      max_nodes: 4
applications:
  - import_path: deploy:app
    runtime_env:
      working_dir: ./
# Propagate dependencies to the Ray cluster.
requirements: python_depset.lock
