# View the docs https://docs.anyscale.com/reference/service-api#serviceconfig.

name: doggos-app

# When empty, use the default image. This can be an Anyscale-provided base image
# like anyscale/ray:2.43.0-slim-py312-cu125, a user-provided base image (provided
# that it meets certain specs), or you can build new images using the Anyscale
# image builder at https://console.anyscale-staging.com/v2/container-images.
image_uri:  anyscale/ray:2.57.0-slim-py312-cu128
# containerfile: /home/ray/default/containerfile

# When empty, Anyscale will auto-select the instance types. You can also specify
# minimum and maximum resources.
compute_config:
#   head_node:
#     instance_type: m5.2xlarge
#   worker_nodes:
#     - instance_type: m5.16xlarge
#       min_nodes: 0
#       max_nodes: 100
#     - instance_type: m7a.24xlarge
#       min_nodes: 0
#       max_nodes: 100
#       market_type: PREFER_SPOT # Defaults to ON_DEMAND
#     - instance_type: g4dn.2xlarge
#       min_nodes: 0
#       max_nodes: 100
#       market_type: PREFER_SPOT # Defaults to ON_DEMAND
#   min_resources:
#     CPU: 100
#     GPU: 1
#   max_resources:
#     CPU: 5000
#     GPU: 100

# Path to a local directory or a remote URI to a .zip file (S3, GS, HTTP) that
# will be the working directory for the job. The files in the directory will be
# automatically uploaded to the job environment in Anyscale.
working_dir: /home/ray/default
excludes: # (Optional) List of files to exclude from being packaged up for the job.
    - .git
    - .env
    - .venv
    - '**/*.egg-info/**'
    - '**/.DS_Store/**'
    - '**/__pycache__/**'

# Skip a top-level `requirements: /home/ray/default/python_depset.lock` here:
# the anyscale CLI would inline the whole lock into the service-create API
# payload and hit the 122880-byte runtime_env cap (same failure the sibling
# job configs hit; see doggos/doggos/{embed,train}.py for the job-side fix).
# The Ray Serve equivalent is to hand the lock to the app under
# `applications[0].runtime_env.pip` as a file path — Ray Serve's runtime_env
# agent reads the file on the cluster instead of inlining it CLI-side. Same
# pattern as templates/asynchronous_inference/service.yaml.
env_vars: # (Optional) Dictionary of environment variables to set in the job.
    # MY_ENV_VAR: my_value
    # ANOTHER_ENV_VAR: another_value

# When empty, this uses the default Anyscale Cloud in your organization.
cloud:

# Specify the Ray Serve app to deploy.
applications:
- import_path: doggos.serve:app
  runtime_env:
    # Absolute path — a relative `requirements:` / `pip:` resolves against the
    # CLI's working directory, not the config's `working_dir`, so a config
    # submitted from a subdirectory would die with FileNotFoundError.
    pip: /home/ray/default/python_depset.lock
    py_modules:
      - /home/ray/default/doggos/doggos
