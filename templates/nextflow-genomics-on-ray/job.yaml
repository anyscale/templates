# Call variants across the GIAB Ashkenazi trio over all of chromosome 20, as an Anyscale Job.
#
#   cd templates/nextflow-genomics-on-ray && anyscale job submit --config-file job.yaml
#
# Submit it from *this* directory. `working_dir: .` below is relative to the shell, not to
# this file, so submitting from the repo root uploads the repo root and the entrypoint finds
# no pipeline/.
#
# The `full` scale it reads, s3://anyscale-public-materials/genomics/giab-trio-illumina-chr20/full/,
# and the image are both published (2026-09-25; tools/stage-demo-data.sh builds the data).
#
# Measured on prod, 2026-09-25, with this file as committed: 299 tasks in 44m07s of pipeline,
# 25.1 CPU hours by Nextflow's count, and about 47 minutes from submission to persisted results.
# Across the trio, SNP F1 was 0.9920-0.9922 and indel F1 0.9446-0.9503. The reads are
# reference-selected, so precision reads somewhat high against a whole-genome run
# (pipeline/PIPELINE.md, "Bounds on the numbers"). Cost has not been measured.
#
# The production counterpart to the notebook, and a cohort for the same reason the notebook
# is one: three samples over 48 intervals is 144 HaplotypeCaller tasks with nothing
# serialising them but the cluster's size, which is the thing this template exists to show.
name: nextflow-genomics-on-ray-chr20-trio

# The template's own image, which carries the toolchain, the nf-ray plugin and the scorer's
# model (see Dockerfile). Processes run with no container runtime, so every tool has to be on
# every node before the first task dispatches; a job's `requirements:` is installed at
# cluster startup, before working_dir is staged, which is why there is none here.
image_uri: us-docker.pkg.dev/anyscale-workspace-templates/workspace-templates/nextflow-genomics-on-ray:2.58.0

working_dir: .
excludes:
  - .ipynb_checkpoints
  - __pycache__
  - .nextflow
  - work

env_vars:
  NF_DEMO_SCALE: full
  # Where the published results are copied before the entrypoint exits. Without it they are
  # deleted with the cluster the moment the job succeeds -- see the entrypoint.
  NF_RAY_RESULTS: /mnt/user_storage/nextflow-genomics-on-ray/results/chr20-trio

# The entrypoint must NOT `exec` the pipeline: nothing could run afterwards, and the results
# would die with the cluster. Capture the status, persist, then exit with the pipeline's own
# code. It must also stay POSIX: Anyscale runs job entrypoints under /bin/sh (dash), where
# `set -o pipefail` is "Illegal option" and nothing runs at all.
entrypoint: |
  set -u
  DATA=/mnt/cluster_storage/nf-genomics/data/full
  OUT=/mnt/cluster_storage/nf-genomics/results
  mkdir -p "$DATA" "$OUT"
  aws s3 sync --no-sign-request --only-show-errors \
    s3://anyscale-public-materials/genomics/giab-trio-illumina-chr20/full/ "$DATA/"
  python pipeline/bin/make_samplesheet.py --data-dir "$DATA" --output "$DATA/samplesheet.csv"

  # -resume is not here on purpose. It needs the work directory from the previous attempt,
  # and /mnt/cluster_storage is recreated per job, so there is nothing to resume from -- which
  # is also why max_retries stays 0 below. Node loss is handled inside the run: nf-ray maps a
  # lost node onto an exit code nf-core's errorStrategy retries.
  nextflow run pipeline/main.nf -profile ray \
    --scale full \
    --samplesheet "$DATA/samplesheet.csv" \
    --reference "$DATA/reference/chr20.fa" \
    --known_sites "$DATA/known_sites/dbsnp138.chr20.vcf.gz" \
    --outdir "$OUT"
  STATUS=$?

  python persist_outputs.py --results "$OUT" || true
  exit $STATUS

# Inline, and the same shapes as configs/nextflow-genomics-on-ray/aws.yaml: the pipeline's
# resource ceiling (pipeline/conf/base.config, conf/ray.config) is sized to these nodes, and a
# request no node can satisfy pends forever on Ray rather than failing. max_nodes is higher
# than the template's config because `full` has six times `quick`'s calling tasks. It is a cost
# bound: the measured run asked for at most 6 cpu-workers and 2 gpu-workers at a time.
compute_config:
  head_node:
    instance_type: m5.2xlarge
    resources:
      CPU: 0
  worker_nodes:
    - name: cpu-worker
      instance_type: r6i.4xlarge
      min_nodes: 1
      max_nodes: 8
    - name: gpu-worker
      instance_type: g6.2xlarge
      min_nodes: 0
      max_nodes: 2
  enable_cross_zone_scaling: true

# 3 h, about four times the measured run's 47 minutes, so a slow capacity day still fits. It was
# 12 h before any run. Tightened because the failure it guards against is a stall, such as an L4
# that never arrives or a request no node can place, and a stalled run should stop within hours
# rather than hold a cluster for half a day.
timeout_s: 10800

# A job-level retry runs on a new cluster with an empty work directory, so it would redo
# everything. Retries belong inside the run, where they are per task.
max_retries: 0
