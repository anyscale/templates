# Call variants for the three GIAB Ashkenazi trio samples over all of chr20, as an Anyscale Job:
# the notebook's pipeline at `full` scale, where 48 intervals give 144 HaplotypeCaller tasks.
#
#   cd templates/nextflow-genomics-on-ray && anyscale job submit --config-file job.yaml
#
# Submit it from this directory. `working_dir: .` is relative to the shell, not to this file,
# so submitting from the repo root uploads the repo root and the entrypoint finds no pipeline/.
# tools/stage-demo-data.sh builds the `full` data the entrypoint syncs.
#
# Measured on prod, 2026-09-25, with this file as committed: the pipeline ran 299 tasks in
# 44m07s, 25.1 CPU hours by Nextflow's count, and the job took about 47 minutes from submission
# to persisted results. SNP F1 was 0.9920-0.9922 across the three samples and indel F1
# 0.9446-0.9503. The reads are reference-selected, so precision reads high against a
# whole-genome run (README, "Measured runs"). Cost was not measured.
name: nextflow-genomics-on-ray-chr20-trio

# The template's image, with the toolchain, the nf-ray plugin and the scorer's model (see
# Dockerfile). Processes run with no container runtime, so every tool has to be on every node
# before the first task starts, and a job's `requirements:` installs pip packages only.
image_uri: us-docker.pkg.dev/anyscale-workspace-templates/workspace-templates/nextflow-genomics-on-ray:2.58.0

working_dir: .
excludes:
  - .ipynb_checkpoints
  - __pycache__
  - .nextflow
  - work

env_vars:
  NF_DEMO_SCALE: full
  # Where persist_outputs.py copies the published results before the entrypoint exits.
  # Without it they go with the cluster when the job ends; see the entrypoint.
  NF_RAY_RESULTS: /mnt/user_storage/nextflow-genomics-on-ray/results/chr20-trio

# The entrypoint must not `exec` the pipeline, or nothing could run after it and the results
# would go with the cluster. It captures the status, persists, then exits with the pipeline's
# own code. It must also stay POSIX: Anyscale runs job entrypoints under /bin/sh (dash), where
# `set -o pipefail` is an "Illegal option" and nothing runs.
entrypoint: |
  set -u
  DATA=/mnt/cluster_storage/nf-genomics/data/full
  OUT=/mnt/cluster_storage/nf-genomics/results
  mkdir -p "$DATA" "$OUT"
  aws s3 sync --no-sign-request --only-show-errors \
    s3://anyscale-public-materials/genomics/giab-trio-illumina-chr20/full/ "$DATA/"
  python pipeline/bin/make_samplesheet.py --data-dir "$DATA" --output "$DATA/samplesheet.csv"

  # -resume is not here on purpose. It needs the work directory from the previous attempt,
  # and /mnt/cluster_storage is recreated per job, so there is nothing to resume from -- which
  # is also why max_retries stays 0 below. Node loss is handled inside the run: nf-ray maps a
  # lost node onto an exit code nf-core's errorStrategy retries.
  nextflow run pipeline/main.nf -profile ray \
    --scale full \
    --samplesheet "$DATA/samplesheet.csv" \
    --reference "$DATA/reference/chr20.fa" \
    --known_sites "$DATA/known_sites/dbsnp138.chr20.vcf.gz" \
    --outdir "$OUT"
  STATUS=$?

  python persist_outputs.py --results "$OUT" || true
  exit $STATUS

# Inline, with the instance types of configs/nextflow-genomics-on-ray/aws.yaml: the pipeline's
# resource ceiling (pipeline/conf/base.config, conf/ray.config) is sized to these nodes, and a
# request no node can satisfy pends forever on Ray. max_nodes is higher than the notebook's
# config because `full` has six times `quick`'s calling tasks. It is a cost bound: the measured
# run asked for at most 6 cpu-workers and 2 gpu-workers at a time.
compute_config:
  head_node:
    instance_type: m5.2xlarge
    resources:
      CPU: 0
  worker_nodes:
    - name: cpu-worker
      instance_type: r6i.4xlarge
      min_nodes: 1
      max_nodes: 8
    - name: gpu-worker
      instance_type: g6.2xlarge
      min_nodes: 0
      max_nodes: 2
  enable_cross_zone_scaling: true

# 3 h, about four times the measured run's 47 minutes, so a slow capacity day still fits. The
# failure it guards against is a stall, such as an L4 that never arrives or a request no node
# can place, and a stalled run should stop within hours instead of holding a cluster.
timeout_s: 10800

# A job-level retry runs on a new cluster with an empty work directory, so it would redo
# everything. Retries happen inside the run, per task.
max_retries: 0
