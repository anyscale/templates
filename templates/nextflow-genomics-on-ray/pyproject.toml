[project]
name = "nf-ray"
# Single-sourced from nf_ray/_version.py, which is what `nf-ray --version` and the
# `doctor` output read. Two literals drift: the package can report one version
# while the distribution metadata reports another, and nothing fails to make that
# visible.
dynamic = ["version"]
description = "Run Nextflow pipelines on Ray and Anyscale clusters"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# No dependencies, on purpose, and this is load-bearing twice over.
#
# Ray is supplied by the base image. Declaring it here would let `pip install .`
# in the Dockerfile pull a second Ray over the image's own, which is the classic
# way to end up with a driver and workers on different versions -- and the one
# failure mode that `ext.image` cannot tolerate at all.
#
# Everything else is standard library because nf_ray.client is spawned once per
# task submit and nf_ray.job is serialized by value into every Ray task. A third
# -party import in either would cost throughput in the first case and break
# workers that do not have this package installed in the second.
dependencies = []

[project.scripts]
nf-ray = "nf_ray.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "nf_ray/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["nf_ray"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PLC0415"]
