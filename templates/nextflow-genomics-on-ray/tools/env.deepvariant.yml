# DeepVariant, quarantined.
#
# This environment exists because DeepVariant pins `python <3.11` and the cluster
# runs 3.12. It is installed to /opt/nf-tools/envs/deepvariant with its own
# interpreter and its own TensorFlow, and it is deliberately **not** on PATH:
# the DEEPVARIANT process calls it by absolute path through
# tools/run_deepvariant.sh, and nothing else in the image can see it.
#
# That isolation is the entire point. The WDL template tried to carry a tool with
# an incompatible Python pin (medaka, `python <3.11`) inside the main environment
# and ended up shipping it disabled. A driver and its Ray workers must agree on
# the interpreter to the patch, so a tool that cannot meet that requirement gets
# its own environment or it does not ship.
#
# Note this is the **CPU** build. DeepVariant's GPU support exists only in
# Google's own `-gpu` Docker image and covers only the `call_variants` stage;
# bioconda's package is CPU TensorFlow. Chasing the GPU build here would mean
# rebuilding DeepVariant on a Ray-matched base, which is the same fight medaka
# lost. The GPU leg of this pipeline is a separate process -- see env.gpu.yml.
name: deepvariant
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - deepvariant=1.10.0
