# The toolchain every process finds on PATH. Versions are pinned, the solve is not; lock-envs.sh
# writes an --explicit lock that build_tools.sh prefers.
name: main
channels:
  - conda-forge
  - bioconda
dependencies:
  # multiqc's interpreter. On PATH after the image's, so `python` stays the image's.
  - python=3.12
  - bwa-mem2=2.3
  - samtools=1.24
  - bcftools=1.24
  # Ships tabix and bgzip.
  - htslib=1.24
  - fastp=1.3.6
  # bioconda's local jar, not the 704 MB release zip that is mostly the unused Spark jar.
  - gatk4=4.6.2.0
  - rtg-tools=3.13
  - multiqc=1.35
  - jq=1.7.1
