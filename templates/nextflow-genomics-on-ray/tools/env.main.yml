# The pipeline's toolchain.
#
# Installed to /opt/nf-tools/envs/main and put on PATH, so every process finds
# its tool without a container. That is the mode this template ships in: there is
# no container runtime inside a Ray worker, so a process that declares
# `container 'quay.io/biocontainers/...'` has nothing to run it. The README's
# "Containers" section has the alternatives (-profile conda, or ext.image).
#
# Versions are pinned exactly; the solve is not. `tools/lock-envs.sh` writes
# `env.main.lock` from a built image with `--explicit` (full URLs plus md5), and
# build_tools.sh prefers a lock when one is present, so a rebuild from it
# installs the same files. None is committed yet. Without it you get the same
# versions of everything named here, and whatever the solver picks beneath them.
name: main
channels:
  - conda-forge
  - bioconda
dependencies:
  # The env's own interpreter, for multiqc. Kept on 3.12 like the image's, but it
  # is not the image's: the Dockerfile appends this env to PATH *last*, so
  # `python` on a Ray worker is still /home/ray/anaconda3/bin/python.
  - python=3.12

  # Alignment and BAM handling. htslib is where `tabix` and `bgzip` come from;
  # samtools and bcftools pull it in anyway, and it is pinned so the version the
  # pipeline's `tabix -p vcf` calls run is written down rather than inferred.
  - bwa-mem2=2.3
  - samtools=1.24
  - bcftools=1.24
  - htslib=1.24

  # Read QC and trimming.
  - fastp=1.3.6

  # GATK Best Practices. Taken from bioconda rather than the GitHub release,
  # which is a 704 MB zip that is mostly the Spark jar this pipeline never calls.
  # bioconda ships the local jar and its wrapper.
  - gatk4=4.6.2.0

  # Benchmarking against the GIAB truth set. `rtg vcfeval` rather than hap.py:
  # it is the engine GA4GH benchmarking runs under hap.py's --engine=vcfeval, and
  # it is a single JVM tool.
  - rtg-tools=3.13

  # Report aggregation.
  - multiqc=1.35

  # Used by the staging script and the notebook, not by the pipeline.
  #
  # No separate `tabix`: bioconda's tabix=1.11 is a 6 KB noarch package that
  # only depends on htslib >=1.9, and the htslib above already ships the
  # binary.
  - jq=1.7.1
