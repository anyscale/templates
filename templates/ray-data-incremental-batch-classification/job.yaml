# Run the pipeline as an Anyscale job:
#   anyscale job submit --config-file job.yaml
name: incremental-batch-classification
entrypoint: python run_pipeline.py
image_uri: anyscale/ray:2.58.0-py312-cu129
requirements: requirements.txt
working_dir: .
# timeout_s is the only bound a job has. A Ray Data job that stops making
# progress raises nothing: the no-progress guard turns itself off when the plan
# contains a shuffle, and job clusters do not idle-terminate. Set it about 30%
# above your longest healthy run. It applies per attempt.
timeout_s: 3600
# Each retry re-runs the whole job, so the worst case is
# timeout_s * (max_retries + 1). Use 0 while a pipeline is still unstable.
max_retries: 1
env_vars:
  NUM_ROWS: "200000"
  GPU_FRACTION: "0.5"
