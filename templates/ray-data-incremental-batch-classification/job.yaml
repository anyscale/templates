# Run the pipeline as an Anyscale job:
#   anyscale job submit --config-file job.yaml
#
# Deps come from the lock only: the entrypoint's `uv pip install --system` covers the driver,
# and run_pipeline.py's ray.init(runtime_env={"pip": ...}) covers the workers. Don't add a
# `requirements:` key. It sets the job runtime_env's `pip`, and Ray 2.58.0 refuses to merge it
# with the script's: ray.init raises "Failed to merge the Job's runtime env"
# (ray/_private/worker.py).
name: incremental-batch-classification
entrypoint: >-
  uv pip install -r python_depset.lock --system --no-deps --no-cache-dir --index-strategy unsafe-best-match
  && python run_pipeline.py
image_uri: anyscale/ray:2.58.0-py312-cu129
# The cluster this template runs on in CI. Without a compute_config the job lands on the
# cloud's default compute config instead. The head has CPU: 0, so Ray schedules the work on
# the workers. AWS instance types; on GCP use n2-standard-8 for the head and the CPU workers
# and g2-standard-8-nvidia-l4-1 for the GPU worker.
compute_config:
  head_node:
    instance_type: m5.2xlarge
    resources:
      CPU: 0
  worker_nodes:
    - name: gpu-worker
      instance_type: g5.2xlarge
      min_nodes: 1
      max_nodes: 1
    - name: cpu-worker
      instance_type: m5.2xlarge
      max_nodes: 2
working_dir: .
# timeout_s is this job's only bound. Job clusters don't idle-terminate, and Ray
# Data's no-progress timeout is off for this plan because run_pipeline.py's
# repartition is an all-to-all operation. Set it about 30% above your longest
# healthy run; it applies per attempt. 3600 is not measured: this job has not
# run on a cluster yet.
timeout_s: 3600
# Each retry re-runs the whole job, so the worst case is
# timeout_s * (max_retries + 1). Use 0 while a pipeline is still unstable.
max_retries: 1
# run_pipeline.py also reads TODAY_PATH, PRIOR_PATH and OUTPUT_PATH (default: under
# STORAGE_DIR, /mnt/cluster_storage/incremental-demo) and STACK_DUMP_AFTER_S (3000). Each
# run deletes everything under OUTPUT_PATH first. Unless os.path.isdir finds both
# TODAY_PATH and PRIOR_PATH, the script writes synthetic data to both, over anything there,
# including any s3:// or gs:// path.
env_vars:
  NUM_ROWS: "200000"
  GPU_FRACTION: "0.5"
