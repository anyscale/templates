# Anyscale Service config for the SDXL app: anyscale service deploy -f service_config.yaml
name: stable-diffusion-service
image_uri: anyscale/ray:2.57.0-py312-cu128
compute_config:
  head_node:
    instance_type: m5.2xlarge
  worker_nodes:
    # main.py pins accelerator_type="L4", so request an L4 node explicitly instead
    # of auto-selecting one — another GPU type leaves the replica PENDING forever.
    - name: gpu-workers
      instance_type: g6.2xlarge
      min_nodes: 1
      max_nodes: 4
applications:
  - import_path: main:stable_diffusion_app
    runtime_env:
      working_dir: ./
# Serve replicas don't inherit the driver's runtime_env.
requirements: python_depset.lock
