<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="460" fill="#fcfcfb"/>

  <!-- ======= inputs ======= -->
  <rect x="24" y="120" width="86" height="30" rx="15" fill="#f0efec"/>
  <text x="67" y="140" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#52514e" text-anchor="middle">fastqs</text>
  <rect x="24" y="330" width="86" height="30" rx="15" fill="#f0efec"/>
  <text x="67" y="350" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#52514e" text-anchor="middle">ref_fasta</text>

  <!-- ======= column 1 ======= -->
  <rect x="150" y="108" width="130" height="54" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3"/>
  <text x="162" y="130" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b">MergeFastqs</text>
  <text x="162" y="150" font-size="11.5" fill="#898781">4 CPUs &#183; 16 GiB</text>

  <rect x="150" y="318" width="172" height="54" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3"/>
  <text x="162" y="340" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b">ComputeGenomeLength</text>
  <text x="162" y="360" font-size="11.5" fill="#898781">2 CPUs &#183; 8 GiB</text>

  <!-- ======= column 2: the measurements (added by this port) ======= -->
  <rect x="330" y="44" width="128" height="54" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="342" y="66" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b">FastqStats</text>
  <text x="342" y="86" font-size="11.5" fill="#898781">1 CPU &#183; 4 GiB</text>

  <rect x="330" y="160" width="158" height="54" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="342" y="182" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b">MeasureDivergence</text>
  <text x="342" y="202" font-size="11.5" fill="#898781">4 CPUs &#183; 16 GiB</text>

  <!-- ======= derived parameters ======= -->
  <rect x="540" y="80" width="220" height="86" rx="8" fill="#f9f9f7" stroke="#1baf7a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="552" y="102" font-size="12.5" font-weight="700" fill="#0b0b0b">derived Flye parameters</text>
  <g font-family="Menlo, Consolas, monospace" font-size="11" fill="#52514e">
    <text x="552" y="121">--nano-raw | --nano-hq</text>
    <text x="552" y="137">--asm-coverage &#183; --genome-size</text>
    <text x="552" y="153">--iterations</text>
  </g>

  <!-- ======= Assemble ======= -->
  <rect x="560" y="228" width="148" height="58" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="572" y="252" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0b0b0b">Assemble</text>
  <text x="572" y="272" font-size="11.5" fill="#1c5cab">Flye &#183; 30 CPUs &#183; 32 GiB</text>

  <!-- ======= MedakaPolish ======= -->
  <rect x="768" y="228" width="150" height="58" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3"/>
  <text x="780" y="252" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b">MedakaPolish</text>
  <text x="780" y="272" font-size="11.5" fill="#898781">rounds 0 &#8658; pass-through</text>

  <!-- ======= fan-out ======= -->
  <rect x="968" y="120" width="128" height="54" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3"/>
  <text x="980" y="142" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b">Quast</text>
  <text x="980" y="162" font-size="11.5" fill="#898781">8 CPUs &#183; 32 GiB</text>
  <text x="980" y="196" font-size="11.5" fill="#898781">&#8594; report &#183; metrics</text>

  <rect x="968" y="330" width="128" height="54" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3"/>
  <text x="980" y="352" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b">AlignAsPAF</text>
  <text x="980" y="372" font-size="11.5" fill="#898781">8 CPUs &#183; 32 GiB</text>
  <text x="980" y="406" font-size="11.5" fill="#898781">&#8594; Paftools &#8594; VCF</text>

  <!-- ======= edges ======= -->
  <g stroke="#c3c2b7" stroke-width="1.6" fill="none">
    <!-- fastqs -> MergeFastqs -->
    <path d="M 110 135 H 144"/>
    <!-- ref -> ComputeGenomeLength -->
    <path d="M 110 345 H 144"/>
    <!-- MergeFastqs -> FastqStats / MeasureDivergence -->
    <path d="M 280 128 C 305 120, 305 80, 324 73"/>
    <path d="M 280 142 C 305 150, 305 184, 324 187"/>
    <!-- FastqStats / MeasureDivergence -> params -->
    <path d="M 458 71 C 500 78, 500 105, 534 110"/>
    <path d="M 488 187 C 515 180, 510 145, 534 138"/>
    <!-- ComputeGenomeLength -> params (genome size) -->
    <path d="M 322 345 C 480 335, 600 240, 626 172"/>
    <!-- MergeFastqs -> Assemble (reads) -->
    <path d="M 280 156 C 420 220, 480 252, 554 256"/>
    <!-- params -> Assemble -->
    <path d="M 634 166 V 222"/>
    <!-- Assemble -> Medaka -->
    <path d="M 708 257 H 762"/>
    <!-- Medaka -> Quast / AlignAsPAF -->
    <path d="M 918 244 C 945 235, 940 160, 962 150"/>
    <path d="M 918 272 C 945 282, 940 348, 962 355"/>
  </g>
  <g fill="#c3c2b7">
    <path d="M 148 135 l -8 -4.5 v 9 z"/>
    <path d="M 148 345 l -8 -4.5 v 9 z"/>
    <path d="M 328 73 l -8.5 -3 l 1.5 8.8 z"/>
    <path d="M 328 188 l -8.8 -4.6 l 0.9 8.9 z"/>
    <path d="M 538 111 l -8.7 -3.7 l 1 8.9 z"/>
    <path d="M 538 137 l -7.7 -5.6 l -0.4 8.9 z"/>
    <path d="M 629 170 l -8 -4.5 l 2.6 8.6 z"/>
    <path d="M 558 257 l -8.4 -4.2 l 0.6 8.9 z"/>
    <path d="M 634 226 l -4.5 -8 h 9 z"/>
    <path d="M 766 257 l -8 -4.5 v 9 z"/>
    <path d="M 966 151 l -8.9 -3.4 l 1.7 8.8 z"/>
    <path d="M 966 354 l -8.4 4.6 l 0.4 -8.9 z"/>
  </g>

  <!-- ======= legend / note ======= -->
  <rect x="24" y="418" width="12" height="12" rx="3" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="44" y="428" font-size="12" fill="#52514e">measurement tasks and the parameter derivation are this port's additions; every other task is upstream's</text>
  <text x="44" y="446" font-size="12" fill="#898781">ref_fasta also feeds Quast and AlignAsPAF (edges omitted); CPU/GiB figures are the chr20 inputs, and each becomes that task's Ray resource request</text>
</svg>
