# Assemble the GIAB Ashkenazi trio over all 64 Mbp of chromosome 20, as an Anyscale Job.
#
#   cd templates/wdl-genomics-on-ray && anyscale job submit --config-file job.yaml
#
# Submit it from *this* directory. `working_dir: .` below is relative to the shell, not to
# this file, so running `anyscale job submit --config-file templates/.../job.yaml` from the
# repo root uploads the repo root instead, and the job dies in seconds with
# "[Errno 2] No such file or directory: 'wdl/pipelines/ONT/Assembly/ONTAssembleCohort.wdl'".
#
# The production counterpart to the notebook: three samples, so their task graphs share the
# worker pool. For one sample, run ONTAssembleWithFlye.wdl with -i inputs.chr20.json instead.
#
# One measured run on this shape (Ray 2.56.0 image, on-demand workers): 2h03m56s for the job,
# against 2h01m15s end to end for the slowest sample, 1h55m33s of it in Flye. The samples run
# concurrently, so the cohort uses about the node-hours of running them one after another, but
# finishes in 2h04m rather than the 5h28m their end-to-end times add up to. The README's time
# and cost section has the per-sample assembly metrics.
#
# No `--asm-coverage`: capping at Flye's documented 40x cut the N50 to a third
# (33.27 -> 11.06 Mbp) to save 14.6 minutes, so the target defaults to 0 and nothing is
# capped. ONTAssembleWithFlye.wdl's header has the four-run grid.
#
# The inputs pass s3:// URIs directly. miniwdl downloads each input once per run, so there is
# no separate staging step.
name: wdl-genomics-on-ray-chr20-trio

# The template's own image, which carries the toolchain (see Dockerfile). Under
# `--container-runtime none` every tool has to be on every node before the first task
# dispatches, and a job's `requirements:` is installed at cluster startup, *before* working_dir
# is staged, so there is deliberately no `requirements:` block here. tools/BUILDING.md has the
# details.
image_uri: us-docker.pkg.dev/anyscale-workspace-templates/workspace-templates/wdl-genomics-on-ray:2.58.0

working_dir: .
excludes:
  - .ipynb_checkpoints
  - __pycache__

env_vars:
  # Where the declared outputs are copied before the driver exits. Without it they are
  # deleted with the cluster when the job succeeds; see the entrypoint.
  WDL_ON_RAY_RESULTS: /mnt/user_storage/wdl-on-ray/results/chr20-trio

# The entrypoint must not `exec` the workflow: `exec` replaces the shell, so the persist step
# after it would never run. Capture the status, persist the outputs, then exit with the
# workflow's own code.
#
# Keep it POSIX: Anyscale runs job entrypoints under /bin/sh (dash), where the bash-only
# `set -o pipefail` fails with "Illegal option" before anything runs. Nothing here pipes
# anything that matters, so `set -u` is enough.
entrypoint: |
  set -u
  # This TMPDIR is the driver's only. Ray workers on other nodes have their own environment,
  # so a task's temporary files land in the worker's /tmp, on node-local disk: usually faster,
  # but bounded by that node's disk. To give each task a temporary directory inside its own
  # working directory on shared storage, set miniwdl's `[file_io] mount_tmpdir = true`, or
  # pass TMPDIR through `[task_runtime] env`.
  export TMPDIR=/mnt/cluster_storage/wdl-on-ray/tmp
  RUN_DIR=/mnt/cluster_storage/wdl-on-ray/runs
  CACHE_DIR=/mnt/cluster_storage/wdl-on-ray/cache
  mkdir -p "$TMPDIR" "$RUN_DIR" "$CACHE_DIR"

  # --call-cache records finished tasks so a rerun can skip them. miniwdl's cache entry
  # points at the output files in RUN_DIR and invalidates itself when they are gone
  # (WDL/runtime/cache.py, _check_files_coherence). Both paths here are under
  # /mnt/cluster_storage, which the platform recreates per job, so as configured the cache
  # only helps a rerun on the same cluster, which a job does not get. That is why
  # max_retries stays 0 below.
  #
  # For resume that survives cluster replacement, put BOTH on a durable mount and let
  # the job retry:
  #     RUN_DIR=/mnt/user_storage/wdl-on-ray/runs
  #     CACHE_DIR=/mnt/user_storage/wdl-on-ray/cache
  # with max_retries: 1. The cost is that the run tree's intermediates, several GB per
  # sample, stay on durable storage instead of dying with the cluster.
  #
  # Under --container-runtime none the toolchain is not part of the cache key: WDL task
  # inputs and the task's own source are. Rebuilding the image with a different Flye
  # will reuse assemblies made by the old one. Clear CACHE_DIR when the image changes.
  wdl-on-ray run wdl/pipelines/ONT/Assembly/ONTAssembleCohort.wdl \
    -i wdl/pipelines/ONT/Assembly/inputs.chr20.cohort.json \
    --container-runtime none \
    --dir "$RUN_DIR" \
    --call-cache "$CACHE_DIR" \
    --verbose
  STATUS=$?

  OUTPUTS=$(ls -t "$RUN_DIR"/*/outputs.json 2>/dev/null | head -1 || true)
  if [ -n "$OUTPUTS" ]; then
    python persist_outputs.py --outputs "$OUTPUTS" || true
  else
    echo "no outputs.json found under $RUN_DIR -- nothing to persist" >&2
  fi
  exit $STATUS

compute_config:
  head_node:
    instance_type: m5.2xlarge
    resources:
      CPU: 0
  worker_nodes:
    # 32 vCPU / 128 GiB. inputs.chr20.cohort.json sets runtime_attr_flye to 30 cpu_cores and
    # flye_num_threads to 30 to fit it, so change the instance type and those two together.
    - instance_type: m5.8xlarge
      min_nodes: 1
      max_nodes: 3
      market_type: PREFER_SPOT  # as configs/wdl-genomics-on-ray/aws.yaml, which says why

# 24 h against the measured 2h03m56s: room for a slower instance type, a whole genome rather
# than one chromosome, or a spot fleet spending part of its preemptible_tries budget.
timeout_s: 86400

# Node loss is handled inside the workflow: Ray node or worker loss becomes miniwdl's
# `Interrupted`, which spends the task's `runtime.preemptible` budget. A job-level retry runs
# on a new cluster, and this job's call cache lives on /mnt/cluster_storage, so a retry would
# find an empty cache and reassemble all three samples from scratch. Raise this to 1 only
# together with the durable RUN_DIR/CACHE_DIR described in the entrypoint.
max_retries: 0
